<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예장통합 절기 캘린더 구독</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 12px 24px;
            border-radius: 980px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: #0077ed;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #a1a1a6;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🗓️ 교회 절기 캘린더</h1>
        <p>예장통합 공인 절기를<br>아이폰/안드로이드 캘린더에서<br>실시간으로 확인하세요.</p>

        <a href="#" id="subscribeBtn" class="btn">캘린더 구독하기</a>
    </div>
    <p class="footer">© 2026 ChristCalendar Service</p>

    <script>
        // 현재 호스트 주소를 가져와서 webcal 링크 생성
        const currentHost = window.location.host;
        const subscribeUrl = `webcal://${currentHost}/calendar.ics`;
        document.getElementById('subscribeBtn').href = subscribeUrl;
    </script>
</body>

</html>
