spring.application.name=ChristCalendar

# 사용할 캐시의 이름을 정의합니다 (여러 개인 경우 쉼표로 구분)
spring.cache.cache-names=churchCalendar

# Caffeine 캐시 상세 설정
# expireAfterWrite=24h : 데이터가 생성/수정된 후 24시간 뒤에 만료
# maximumSize=100 : 메모리에 최대 100개까지만 보관 (메모리 관리용)
spring.cache.caffeine.spec=expireAfterWrite=24h,maximumSize=100